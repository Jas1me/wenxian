<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T³ - 医学文献检索系统</title>
<style>
:root{
  --teal:#0e7c86; --teal-dark:#0a5c64; --teal-light:#e6f4f5; --ink:#1f2a33;
  --muted:#6b7a85; --line:#dfe9ec; --bg:#f7fafa; --card:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
header{background:linear-gradient(135deg,var(--teal-dark),var(--teal));color:#fff;padding:14px 5%}
header .bar{display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:0 auto}
.logo{font-size:20px;font-weight:700;letter-spacing:.5px}
.logo span{opacity:.75;font-weight:400;font-size:13px;margin-left:8px}
nav button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px}
.hero{max-width:1200px;margin:28px auto 0;padding:0 5%;text-align:center}
.hero h1{font-size:30px;margin-bottom:8px}
.hero p{color:var(--muted);margin-bottom:20px}
.searchbox{display:flex;max-width:720px;margin:0 auto;background:#fff;border:2px solid var(--teal);border-radius:12px;overflow:hidden;box-shadow:0 6px 24px rgba(14,124,134,.12)}
.searchbox input{flex:1;border:none;outline:none;padding:14px 18px;font-size:15px}
.searchbox button{background:var(--teal);color:#fff;border:none;padding:0 32px;font-size:16px;cursor:pointer}
.searchbox button:hover{background:var(--teal-dark)}
.chips{margin-top:12px}
.chips span{font-size:12px;color:var(--muted)}
.chips button{background:var(--teal-light);border:1px solid var(--teal);color:var(--teal);border-radius:16px;padding:4px 12px;margin:4px 4px 0;cursor:pointer;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;max-width:1200px;margin:28px auto;padding:0 5%}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--teal)}
.stat span{font-size:13px;color:var(--muted)}
.layout{max-width:1200px;margin:0 auto 40px;padding:0 5%;display:grid;grid-template-columns:280px 1fr;gap:20px}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h3{font-size:15px;margin-bottom:12px;color:var(--teal-dark);border-bottom:1px solid var(--line);padding-bottom:8px}
.f-group{margin-bottom:16px}
.f-group .lab{font-size:12px;color:var(--muted);margin-bottom:6px;display:block}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.type-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 4px;border-radius:6px;cursor:pointer}
.type-row:hover{background:var(--teal-light)}
.type-row em{font-style:normal;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--teal)}
.result-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.result-head h3{margin:0;border:none;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 16px rgba(14,124,134,.1)}
.card h4{font-size:15px;line-height:1.5;margin-bottom:6px}
.card .meta{font-size:12px;color:var(--muted);margin-bottom:6px}
.badge{display:inline-block;background:var(--teal-light);color:var(--teal);border-radius:10px;padding:2px 10px;font-size:11px;margin-right:6px}
.card .abs{font-size:13px;color:#4a5860;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pager{display:flex;gap:8px;justify-content:center;margin-top:16px}
.pager button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 14px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.pager button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.empty{text-align:center;color:var(--muted);padding:50px 0}
.empty .big{font-size:40px;margin-bottom:10px}
section.collections{max-width:1200px;margin:0 auto;padding:0 5%}
.coll-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:16px}
.coll{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;cursor:pointer;transition:transform .15s}
.coll:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(14,124,134,.12)}
.coll .ico{width:44px;height:44px;border-radius:10px;background:var(--teal-light);display:flex;align-items:center;justify-content:center;margin-bottom:12px;color:var(--teal)}
.coll h4{font-size:15px;margin-bottom:4px}
.coll p{font-size:12px;color:var(--muted);margin-bottom:8px}
.coll .n{font-size:13px;color:var(--teal);font-weight:600}
section.subscribe{background:linear-gradient(135deg,var(--teal-dark),var(--teal));margin-top:48px;padding:44px 5%;text-align:center;color:#fff}
.subscribe h2{font-size:22px;margin-bottom:6px}
.subscribe p{opacity:.85;margin-bottom:18px;font-size:14px}
.sub-box{display:flex;max-width:440px;margin:0 auto;background:#fff;border-radius:10px;overflow:hidden}
.sub-box input{flex:1;border:none;outline:none;padding:12px 16px}
.sub-box button{background:var(--teal-dark);color:#fff;border:none;padding:0 24px;cursor:pointer}
.sub-msg{margin-top:10px;font-size:13px;min-height:18px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
.api-ok{display:inline-block;background:#e8f7ee;color:#1a7f3d;border-radius:12px;padding:3px 14px;font-size:12px;margin-top:14px}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo">T<sup style="font-size:14px">3</sup> <span>医学文献检索系统</span></div>
    <nav><button onclick="toggleLang()" id="langBtn">EN</button></nav>
  </div>
</header>

<div class="hero">
  <h1 id="t-title">医学文献检索系统</h1>
  <p id="t-sub">专注孤独症谱系障碍研究 · 数据来自 PubMed 真实文献库</p>
  <div class="searchbox">
    <input id="q" placeholder="输入关键词，如：TEACCH、基因、筛查……" onkeydown="if(event.key==='Enter')doSearch(1)">
    <button onclick="doSearch(1)" id="t-search">检索</button>
  </div>
  <div class="chips" id="chips"></div>
  <div><span class="api-ok" id="apiStatus">✅ 已连接真实数据库（SQLite）</span></div>
</div>

<div class="stats" id="stats"></div>

<div class="layout">
  <!-- 筛选面板 -->
  <aside class="panel">
    <h3 id="t-filter">筛选条件</h3>
    <div class="f-group">
      <span class="lab" id="t-year">发表年份</span>
      <div class="seg" id="yearSeg"></div>
    </div>
    <div class="f-group">
      <span class="lab" id="t-type">文献类型</span>
      <div id="typeList"></div>
    </div>
    <div class="f-group">
      <span class="lab" id="t-if">影响因子 ≥ <b id="ifVal">0</b></span>
      <input type="range" id="ifRange" min="0" max="10" step="1" value="0" oninput="document.getElementById('ifVal').textContent=this.value" onchange="doSearch(1)">
    </div>
  </aside>

  <!-- 结果列表 -->
  <main>
    <div class="result-head">
      <h3 id="t-result">检索结果</h3>
    </div>
    <div id="results"></div>
    <div class="pager" id="pager"></div>
  </main>
</div>

<section class="collections">
  <h3 style="color:var(--teal-dark)" id="t-coll">专题合集</h3>
  <div class="coll-grid" id="collGrid"></div>
</section>

<section class="subscribe">
  <h2 id="t-sub2">订阅文献更新提醒</h2>
  <p id="t-sub3">获取孤独症研究领域最新发表的病例报告和临床研究 · 每周更新 · 随时退订</p>
  <div class="sub-box">
    <input id="email" type="email" placeholder="your@email.com">
    <button onclick="subscribe()" id="t-btn">订阅</button>
  </div>
  <div class="sub-msg" id="subMsg"></div>
</section>

<footer>T³ · Autism Literature Database · Powered by SQLite</footer>

<script>
const API = ""; // 同源部署；本地调试后端在别的端口时改成 http://localhost:8000
let state = { q:"", type:"", year_from:"", year_to:"", if_min:0, collection:"", page:1 };
let TYPES = [], total = 0;

const I18N = {
  zh: {title:"医学文献检索系统", sub:"专注孤独症谱系障碍研究 · 数据来自 PubMed 真实文献库",
       search:"检索", filter:"筛选条件", year:"发表年份", type:"文献类型", if:"影响因子 ≥",
       result:"检索结果", coll:"专题合集", sub2:"订阅文献更新提醒",
       sub3:"获取孤独症研究领域最新发表的病例报告和临床研究 · 每周更新 · 随时退订",
       btn:"订阅", found:p=>`共找到 ${p} 条结果`, empty:"未找到符合条件的文献", tip:"请尝试调整筛选条件"},
  en: {title:"Medical Literature Search", sub:"Focused on Autism Spectrum Disorder · Real PubMed data",
       search:"Search", filter:"Filters", year:"Year", type:"Article type", if:"Impact factor ≥",
       result:"Results", coll:"Collections", sub2:"Subscribe to updates",
       sub3:"Latest ASD case reports & clinical studies, weekly · unsubscribe anytime",
       btn:"Subscribe", found:p=>`${p} results found`, empty:"No matching articles", tip:"Try adjusting filters"}
};
let lang = "zh";
const t = k => I18N[lang][k];

async function jget(url){ const r = await fetch(API+url); if(!r.ok) throw new Error(r.status); return r.json(); }
async function jpost(url, body){ const r = await fetch(API+url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); return r.json(); }

function esc(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function loadStats(){
  try{
    const s = await jget("/api/stats");
    const by = s.by_type;
    TYPES = Object.entries(by).sort((a,b)=>b[1]-a[1]);
    const box = document.getElementById("stats");
    box.innerHTML = [
      [s.total, lang==="zh"?"文献总数":"Articles"],
      [by["病例报告"]||0, lang==="zh"?"病例报告":"Case reports"],
      [s.recent, lang==="zh"?"2025年及以后":"2025 & later"],
      [s.sources, lang==="zh"?"期刊来源":"Journals"],
      [`${s.year_min}–${s.year_max}`, lang==="zh"?"覆盖年份":"Coverage"]
    ].map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
    renderTypes();
  }catch(e){ document.getElementById("apiStatus").textContent = "⚠️ 后端API未连接"; }
}

function renderTypes(){
  const el = document.getElementById("typeList");
  el.innerHTML = TYPES.map(([k,v])=>
    `<div class="type-row ${state.type===k?'on':''}" onclick="setType('${k}')"><span>${k}</span><em>${v}</em></div>`).join("");
}
function setType(k){ state.type = (state.type===k?"":k); state.page=1; renderTypes(); doSearch(1); }

function renderYearSeg(){
  const years = [["","全部"],[2025,"近1年"],[2021,"近5年"],[2016,"近10年"],[2006,"近20年"]];
  document.getElementById("yearSeg").innerHTML = years.map(([v,l])=>
    `<button class="${String(state.year_from)===String(v)?'on':''}" onclick="setYear('${v}')">${l}</button>`).join("");
}
function setYear(v){ state.year_from = v; state.page=1; renderYearSeg(); doSearch(1); }

async function doSearch(page){
  state.page = page || 1;
  state.q = document.getElementById("q").value.trim();
  state.if_min = document.getElementById("ifRange").value;
  const p = new URLSearchParams({page:state.page, page_size:10});
  for(const k of ["q","type","year_from","if_min","collection"]) if(state[k]!==""&&state[k]!=null) p.set(k,state[k]);
  const res = await jget("/api/search?"+p);
  total = res.total;
  document.getElementById("t-result").textContent = t("found")(total);
  const box = document.getElementById("results");
  if(!res.items.length){
    box.innerHTML = `<div class="empty"><div class="big">🔍</div><p>${t("empty")}</p><p style="font-size:13px">${t("tip")}</p></div>`;
  }else{
    box.innerHTML = res.items.map(a=>`
      <div class="card">
        <h4><a href="${esc(a.url||'#')}" target="_blank" rel="noopener">${esc(a.title)}</a></h4>
        <div class="meta">${esc(a.authors)} · ${esc(a.journal)} · ${a.year}</div>
        <div style="margin-bottom:6px">
          <span class="badge">${esc(a.pub_type)}</span>
          ${a.collection?`<span class="badge" style="background:#fdf3e3;color:#a06a10">${esc(a.collection)}</span>`:""}
          ${a.pmid?`<span class="badge" style="background:#eef1ff;color:#3f51b5">PMID: ${a.pmid}</span>`:""}
        </div>
        <div class="abs">${esc(a.abstract||"")}</div>
      </div>`).join("");
  }
  renderPager(res.page, Math.ceil(res.total/10));
}

function renderPager(page, pages){
  const el = document.getElementById("pager");
  if(pages<=1){ el.innerHTML=""; return; }
  let h = `<button ${page<=1?"disabled":""} onclick="doSearch(${page-1})">‹</button>`;
  for(let i=1;i<=pages;i++) h += `<button class="${i===page?'on':''}" onclick="doSearch(${i})">${i}</button>`;
  h += `<button ${page>=pages?"disabled":""} onclick="doSearch(${page+1})">›</button>`;
  el.innerHTML = h;
}

async function loadCollections(){
  const cols = await jget("/api/collections");
  const icons = {
    screening:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
    genetics:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 3c0 6 16 6 16 12M4 21c0-6 16-6 16-12M6 3v3M6 18v3M18 3v3M18 18v3"/></svg>',
    intervention:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-9-9c-1.5-3.5 1-8 5-8 2 0 3.5 1 4 2 .5-1 2-2 4-2 4 0 6.5 4.5 5 8-2 4.5-9 9-9 9z"/></svg>',
    comorbidity:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>',
    speech:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M8 7v10M4 10v4M16 7v10M20 10v4"/></svg>',
    emerging:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>'
  };
  document.getElementById("collGrid").innerHTML = cols.map(c=>`
    <div class="coll" onclick="openCollection('${c.name}')">
      <div class="ico">${icons[c.icon]||icons.screening}</div>
      <h4>${esc(c.name)}</h4>
      <p>${esc(c.desc)}</p>
      <div class="n">${c.count} 篇文献${c.latest_year?` · 更新至${c.latest_year}`:""}</div>
    </div>`).join("");
}
function openCollection(name){
  state.collection = name; state.q=""; document.getElementById("q").value="";
  state.type=""; renderTypes(); doSearch(1);
  window.scrollTo({top:document.querySelector(".layout").offsetTop-20, behavior:"smooth"});
}

async function subscribe(){
  const email = document.getElementById("email").value.trim();
  const msg = document.getElementById("subMsg");
  const r = await jpost("/api/subscribe",{email});
  msg.textContent = r.msg || "";
  msg.style.color = r.ok ? "#aef0c8" : "#ffd2d2";
  if(r.ok) document.getElementById("email").value="";
}

function renderChips(){
  const kw = ["ABA","ESDM","PACT","AAC","TEACCH","家长干预","言语","RDI","音乐治疗","数字疗法"];
  document.getElementById("chips").innerHTML =
    `<span>${lang==="zh"?"常用检索:":"Popular: "}</span>` +
    kw.map(k=>`<button onclick="document.getElementById('q').value='${k}';doSearch(1)">${k}</button>`).join("");
}

function toggleLang(){
  lang = lang==="zh" ? "en" : "zh";
  const d = I18N[lang];
  document.getElementById("langBtn").textContent = lang==="zh" ? "EN" : "中文";
  document.getElementById("t-title").textContent = d.title;
  document.getElementById("t-sub").textContent = d.sub;
  document.getElementById("t-search").textContent = d.search;
  document.getElementById("t-filter").textContent = d.filter;
  document.getElementById("t-year").textContent = d.year;
  document.getElementById("t-type").textContent = d.type;
  document.querySelector(".f-group:nth-of-type(3) .lab").firstChild.textContent = d.if+" ";
  document.getElementById("t-coll").textContent = d.coll;
  document.getElementById("t-sub2").textContent = d.sub2;
  document.getElementById("t-sub3").textContent = d.sub3;
  document.getElementById("t-btn").textContent = d.btn;
  renderChips(); loadStats(); doSearch(1);
}

renderChips(); renderYearSeg();
loadStats(); loadCollections(); doSearch(1);
</script>
</body>
</html>
